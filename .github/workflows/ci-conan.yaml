name: Compile Linux (Ubuntu LTS) with conan

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: Build on ${{ matrix.os }} with conan
    if: ${{ !contains(github.event.head_commit.message, '/skip-ci') }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        meson_version: ["1.7.0"]
        ninja_version: ["1.10.2"]
    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: rope
          fetch-depth: 0

      - name: Restore source file timestamps for meson caching
        working-directory: rope
        run: |
          git ls-files | while read f; do
            [ -f "$f" ] || continue
            t=$(git log -1 --format="%ct" -- "$f")
            touch -t $(date -d @$t +%Y%m%d%H%M.%S) "$f"
          done

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install git build-essential gdb pkg-config
          python3 -m pip install meson==${{ matrix.meson_version }} ninja==${{ matrix.ninja_version }} conan

      - name: Install system dependencies (SDL2)
        run: |
          sudo apt-get -y install libsdl2-dev libsdl2-image-dev libglew-dev

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.os }}-${{ hashFiles('rope/conanfile.py', 'rope/recipes/**') }}
          restore-keys: |
            conan-${{ matrix.os }}-

      - name: Cache Meson build
        uses: actions/cache@v4
        with:
          path: rope/build/ci_build
          key: meson-${{ matrix.os }}-${{ hashFiles('rope/**/*.cpp', 'rope/**/*.h', 'rope/**/meson.build') }}
          restore-keys: |
            meson-${{ matrix.os }}-

      - name: Run setup script
        working-directory: rope
        run: setup-scripts/setup.sh --yesman --build=build/ci_build --prefix=$(pwd)/install

      - name: Install RoPE
        working-directory: rope
        run: meson install -C build/ci_build

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: rope_conan_${{ matrix.os }}_${{ github.sha }}
          path: rope/install/bin/*
          if-no-files-found: error

